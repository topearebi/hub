name: CI

# The gate runs once per change:
#   - `pull_request` → CI runs directly.
#   - `workflow_call` → the deploy workflow reuses this job so a push to `main`
#     is verified exactly once (no duplicate run alongside deploy).
on:
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  verify:
    name: Typecheck, Lint, Test, Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Unit + component tests, including the axe-core accessibility gate
      # (zero serious/critical violations) added in Phase 11.
      - name: Test
        run: npm run test

      # Token contrast gate: text >= 4.5:1, controls/focus >= 3:1 (Phase 2).
      - name: Contrast
        run: npm run check:contrast

      - name: Build
        run: npm run build

      # Gzip bundle budget (< 60 KB initial JS + CSS) — Phase 11, G-56.
      - name: Bundle size
        run: npm run check:bundle

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # PWA pass, Accessibility >= 95, Performance >= 90 (mobile profile).
      # `lighthouserc.json` starts `vite preview` and asserts the budgets.
      - name: Run Lighthouse CI
        run: npm run lighthouse
