name: CI

# The gate runs once per change:
#   - `pull_request` → CI runs directly.
#   - `workflow_call` → the deploy workflow reuses this job so a push to `main`
#     is verified exactly once (no duplicate run alongside deploy).
on:
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  verify:
    name: Typecheck, Lint, Test, Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
