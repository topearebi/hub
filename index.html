<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#faf7f2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#181716" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Hub — a local-first browser launchpad." />
    <!-- Pre-paint background: an external critical stylesheet (inline <style> is
         forbidden by AGENTS.md) prevents a light flash for dark-theme users
         before the hashed bundle loads. -->
    <link rel="stylesheet" href="./critical.css" />

    <!-- Standalone / installed-app metadata (G-51). -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Hub" />

    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="mask-icon" href="./icon.svg" color="#b04a2e" />
    <link rel="manifest" href="./manifest.json" />

    <!-- iOS launch images (G-51): iOS ignores the manifest background, so these
         prevent a white flash on launch. Sizes cover the common device classes. -->
    <link
      rel="apple-touch-startup-image"
      href="./splash-750x1334.png"
      media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2)"
    />
    <link
      rel="apple-touch-startup-image"
      href="./splash-1170x2532.png"
      media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)"
    />
    <link
      rel="apple-touch-startup-image"
      href="./splash-1284x2778.png"
      media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3)"
    />
    <link
      rel="apple-touch-startup-image"
      href="./splash-1536x2048.png"
      media="(device-width: 768px) and (device-height: 1024px) and (-webkit-device-pixel-ratio: 2)"
    />

    <!--
      Content-Security-Policy (authored in Phase 8, enabled in Phase 9 once the
      environment-lookup fetches were removed). `connect-src` allows only the
      app's own origin and the GitHub API, enforcing the zero-telemetry promise
      (PRD §2.2). `img-src` permits `data:` (avatars/logos) and `https:` (remote
      favicons/avatars the user has chosen).
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https://api.github.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <title>Hub</title>
  </head>
  <body>
    <div id="app"></div>
    <noscript>Hub requires JavaScript to run.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
